          - paragraph [ref=e78]: I discovered that Balto’s users were using the app’s feedback feature to create a log of tech issues they experienced. I aggregated and analyzed this data to surface user pain points and designed a new workflow to save the Support team more than 200 hours annually.
          - heading [level=3] [ref=e84]:
            - link "User Experience and Choice in Hearing Aid Adoption - Research Project" [ref=e85] [cursor=pointer]:
              - /url: /hearing-aid-adoption-ux
          - code [ref=e92]: UX Research
          - link [ref=e100] [cursor=pointer]:
            - /url: /hearing-aid-adoption-ux
          - generic [ref=e106]:
            - paragraph [ref=e107]: Only about 20% of Americans who could benefit from hearing aids use them. I wanted to understand why hearing aid adoption rates are so low, and how UX could be leveraged to help.
            - paragraph [ref=e108]: I conducted heuristic evaluations of informational hearing aid webpages and discovered they all had similar issues around consistency, navigation, and information hierarchy, which makes it difficult for users to access information needed to choose a hearing aid. My findings indicate that these webpages—and this sector more broadly—can implement UX best practices to make their information more accessible for the user, aiding the decision making process in choosing a hearing aid.
          - heading [level=3] [ref=e114]:
            - link "Joplin Public Library - Website" [ref=e115] [cursor=pointer]:
              - /url: /joplinpubliclibrary
          - code [ref=e122]: UX design, UX Writing, UX Research
          - link [ref=e130] [cursor=pointer]:
            - /url: /joplinpubliclibrary
          - paragraph [ref=e137]: The website for the City of Joplin’s public library was difficult to navigate and use — to the point where users couldn’t carry out important tasks or find information on the library’s offerings. To solve this, I created and tested a new, successful information architecture for the site and designed improved layouts for the site’s most important landing pages.
