          - heading [level=3] [ref=e489]:
            - button "Do you work with developers or hand off files?" [ref=e490] [cursor=pointer]:
              - generic [aria-hidden] [ref=e492]: +
          - region "Do you work with developers or hand off files?":
            - paragraph [ref=e493]: Both. I document tokens, states, and component behavior when engineering owns the build. On projects where I build with agents and stay in the code, the handoff may be a pull request instead of a file. At Tire Rack, I helped build and document the AEM templates and production styles the team now reuses.
        - generic [ref=e494]:
          - heading [level=3] [ref=e495]:
            - button "Can you work within an existing design system?" [ref=e496] [cursor=pointer]:
              - generic [aria-hidden] [ref=e498]: +
          - region "Can you work within an existing design system?":
            - paragraph [ref=e500]:
              - text: "Yes. I have extended existing token and component systems, and I have built them from scratch when the product had no shared foundation. In either case, I start by learning which rules are doing useful work before I propose a new one. My bar is written up here:"
              - link "a good design system makes better decisions easier" [ref=e501] [cursor=pointer]:
                - /url: /notes/systems-that-make-better-decisions-easier
              - text: .
        - generic [ref=e502]:
          - heading [level=3] [ref=e503]:
            - button "How do you handle projects that need both brand and UX work?" [ref=e504] [cursor=pointer]:
              - generic [aria-hidden] [ref=e506]: +
          - region "How do you handle projects that need both brand and UX work?":
            - paragraph [ref=e507]: I treat the identity and the interface as one system. The brand sets the visual and verbal rules; the product tests those rules against real tasks, states, and content. I scope them together when separating the work would create two different answers.
        - generic [ref=e508]:
