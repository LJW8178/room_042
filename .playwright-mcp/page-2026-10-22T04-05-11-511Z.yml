              - text: if a future fit is possible.
        - generic [ref=e516]:
          - heading [level=3] [ref=e517]:
            - button "What drives you outside of design?" [ref=e518] [cursor=pointer]:
              - generic [aria-hidden] [ref=e520]: +
          - region "What drives you outside of design?":
            - generic [ref=e521]:
              - paragraph [ref=e522]: People first. I married my high school sweetheart Stephanie. We've now spent more than half our lives together, and our two kids are the center of everything. Weekends usually mean the park, the zoo, or wherever the next national park road trip takes us.
              - paragraph [ref=e523]:
                - text: "Outside of family, a lot of what I do for fun still involves building things. I manage my Type 1 diabetes using a custom-coded branch of the Loop app, a closed-loop insulin delivery system I've configured and maintained myself. It's equal parts health management and engineering hobby, and it eventually became a product:"
                - link "LoopStack" [ref=e524] [cursor=pointer]:
                  - /url: /work/loopstack/
                - text: ", a pattern-review app built on my own data."
              - paragraph [ref=e525]: Football Sundays are sacred. I've run a dynasty fantasy football league, the Grandville Gremlins, for about a decade, and every team has a custom mascot and logo I designed. It keeps a tight group of high school and college friends connected year-round. And like most people, I unwind with good TV and film. Always watching something.
